name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          SECRET_KEY: ZGV2LW9ubHktcmVwbGFjZS1pbi1wcm9kdWN0aW9uLTAwMDAwMA==
          DATABASE_URL: sqlite+pysqlite:///:memory:
        run: pytest -q tests/test_security.py tests/test_detector.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t noahub-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t noahub-frontend:ci ./frontend