# ============================================================
# Interface Hub 에이전트 구성 — 코드(app/agents/config.py)가 이 파일을 읽어
# 그래프 경로·도구 목록·한도를 만듭니다. 모델 이름은 .env (AGENT_MODEL_*).
# ============================================================

router:
  id: router
  name: 안내 에이전트
  model_level: fast
  rules_first: true            # 기존 키워드 점수(classify_intent) 먼저, 애매하면 LLM
  pre_guards:                  # 라우터 앞단에 그대로 두는 기존 가드
    - short_question_guard     # 5자 미만 → LLM 호출 없음
    - repeat_failure_guard     # 같은 질문 24시간 안 환경 결함 실패 → 저장된 안내 재사용
    - answer_cache             # Redis 답변 캐시
  routes:                      # intent: 맡을 에이전트 id
    stats_query: stats_agent
    config_query: config_agent
    case_lookup: case_agent
    general: case_agent
    root_cause: rca_agent
  on_unclear: disambiguate     # RCA 대상을 못 정하면 되묻기
  max_steps: 1

agents:
  - id: stats_agent
    name: 통계 분석 에이전트
    role: 최근 7일 운영 통계 표만 근거로 답한다. 표에 없는 일반론은 쓰지 않는다.
    model_level: balanced
    tools: [get_ops_stats]
    stop_when: 수치를 인용한 답을 만들었거나 "제공된 통계로는 답할 수 없음"을 밝혔을 때. LLM 이 없으면 표를 그대로 답한다.
    max_steps: 2

  - id: config_agent
    name: 설정 점검 에이전트
    role: 등록된 인터페이스 메타 표만 근거로 답한다. 시크릿 값은 다루지 않는다.
    model_level: fast
    tools: [get_interface_config]
    stop_when: 표에서 찾은 사실로 답했거나 "등록된 정보 내에 없음"을 밝혔을 때
    max_steps: 2

  - id: case_agent
    name: 장애 사례 검색 에이전트
    role: 해결된 과거 장애 Top-K 를 찾아 원인 가설과 조치를 답하고 [#ID] 로 인용한다.
    model_level: balanced
    tools: [search_similar_cases]
    stop_when: 인용이 있는 답을 만들었을 때. 과거 사례가 없거나 유사도가 기준 미만이면 LLM 없이 "찾지 못했습니다"로 끝낸다.
    min_evidence_score: 0.05
    max_steps: 2

  - id: rca_agent
    name: 장애 원인 분석 에이전트
    role: 열린 장애의 최근 호출 로그·재시도·SLA·이상 점수·비슷한 과거 사례를 모아 원인 가설 1~3개와 점검 순서를 제안한다. 재처리·음소거·해결 처리는 하지 않는다.
    model_level: top
    tools: [get_incident_detail, get_recent_call_logs, get_retry_stats, get_sla_status, get_anomaly_score, search_similar_cases]
    stop_when: 가설마다 근거 수치를 인용한 답을 만들었을 때. 대상을 못 정하면 되묻고, 근거가 하나도 없으면 LLM 없이 "근거 부족 — 운영자 확인 필요"로 끝낸다.
    max_steps: 7
    handoff_to: [human]

reviewer:
  enabled: false               # 각 에이전트가 이미 근거만으로 답하도록 제한됨 + no_match 면 LLM 호출 안 함
  id: review_agent
  max_bounces: 0

# 어떤 에이전트 도구 목록에도 들어가면 안 되는 함수 (tests/test_agent_tools_guard.py 가 검사)
forbidden_tools:
  - execute_interface
  - _exec_with_retry
  - retry_call_log
  - bulk_retry
  - retry_related
  - resolve_incident
  - update_incident
  - create_incident
  - mark_related_handled
  - create_interface
  - update_interface
  - delete_interface
  - mute_interface
  - unmute_interface
  - restore_interface
  - reveal_secret
  - dispatch_alert
  - check_expiring_secrets
  - sync_jobs
  - update_alert_rule
  - record_audit
  - create_user
  - update_user
  - disable_user
  - enable_user
  - force_logout
  - unlock_user
  - reset_password
  - invalidate_all
