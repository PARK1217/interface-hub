# 에이전트 전환 전후 비교용 평가셋 (seed_demo 데이터 기준)
# - expected_intent: 응답의 intent 필드 (전환 전에도 있던 값)
# - expected_route : 전환 후 응답의 route 필드 (실제로 일한 에이전트)
# - expected_outcome: 응답의 outcome 필드
# - only_after: 전환 후에 새로 생긴 기능 (전환 전 측정에서는 건너뜀)
# - incident_id 가 있으면 /api/ai/rca 로, 없으면 /api/ai/ask 로 보냅니다.
items:
  - id: q01
    question: 지금 가장 장애가 잦은 인터페이스가 뭐야?
    expected_intent: stats_query
    expected_route: stats_agent
    expected_outcome: success
  - id: q02
    question: 최근 7일 실패율 Top 5 인터페이스 알려줘
    expected_intent: stats_query
    expected_route: stats_agent
    expected_outcome: success
  - id: q03
    question: 오늘 호출 건수 추이는 어때?
    expected_intent: stats_query
    expected_route: stats_agent
    expected_outcome: success
  - id: q04
    question: 5xx 오류 많은 인터페이스 순위 알려줘
    expected_intent: stats_query
    expected_route: stats_agent
    expected_outcome: success
  - id: q05
    question: 현재 등록된 인터페이스 cron 스케줄 어떻게 설정되어 있어?
    expected_intent: config_query
    expected_route: config_agent
    expected_outcome: success
  - id: q06
    question: 보험개발원 인터페이스 엔드포인트 url 이 뭐야?
    expected_intent: config_query
    expected_route: config_agent
    expected_outcome: success
  - id: q07
    question: 시크릿이 등록된 인터페이스 목록 보여줘
    expected_intent: config_query
    expected_route: config_agent
    expected_outcome: success
  - id: q08
    question: 신용정보원 CB조회가 갑자기 401 다발로 막혔어 어떻게 처리?
    expected_intent: case_lookup
    expected_route: case_agent
    expected_outcome: success
  - id: q09
    question: 보험개발원 API 타임아웃 원인과 조치 방법은?
    expected_intent: case_lookup
    expected_route: case_agent
    expected_outcome: success
  - id: q10
    question: SSL 인증서 만료로 호출 실패하면 어떻게 복구해?
    expected_intent: case_lookup
    expected_route: case_agent
    expected_outcome: success
  - id: q11
    question: 강아지 산책 시간이 매번 달라지는 원인을 알려줘
    expected_intent: case_lookup
    expected_route: case_agent
    expected_outcome: no_match
  - id: q12
    question: 보험회사 기업문화 특징이 궁금합니다
    expected_intent: general
    expected_route: case_agent
    expected_outcome: [success, no_match]
  - id: q13
    question: 장애
    expected_intent: general
    expected_route: guard
    expected_outcome: empty_question
  - id: q14
    question: 보험개발원 상태 좀 봐줘
    expected_intent: general
    expected_route: case_agent
    expected_outcome: [success, no_match]
  - id: r01
    question: "(장애 화면) 원인 분석"
    incident_id: 18
    expected_intent: root_cause
    expected_route: rca_agent
    expected_outcome: success
    only_after: true
  - id: r02
    question: "(장애 화면) 원인 분석"
    incident_id: 2
    expected_intent: root_cause
    expected_route: rca_agent
    expected_outcome: success
    only_after: true
