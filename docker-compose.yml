services:
  postgres:
    image: postgres:15-alpine
    container_name: noa-hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noahub_pw}
      POSTGRES_DB: ${POSTGRES_DB:-noahub}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noahub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: noa-hub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sftp:
    image: atmoz/sftp:alpine
    container_name: noa-hub-sftp
    ports:
      - "2222:22"
    # username:password:::dir-to-create-under-home
    command: noahub:noahub_pw:::upload
    volumes:
      - ./fixtures/sftp/upload:/home/noahub/upload

  backend:
    build: ./backend
    container_name: noa-hub-backend
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sftp:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: noa-hub-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Vite dep 캐시를 컨테이너 내부에 유지 (Windows bind mount 와 충돌 방지).
      # 이게 없으면 .vite/deps 가 호스트 파일시스템과 동기화되면서 chunk
      # missing 에러로 Vite 가 옛 번들을 서빙 → HMR 깨짐 → 새로고침 무의미.
      - /app/node_modules/.vite
    environment:
      # Windows bind mount 에서 inotify 가 안 와서 HMR 이 무한정 안 갱신되는
      # 문제 회피. 폴링 방식으로 ~1초 간격 변경 감지.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data: