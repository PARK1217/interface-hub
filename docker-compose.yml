services:
  postgres:
    image: postgres:15-alpine
    container_name: noa-hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noahub_pw}
      POSTGRES_DB: ${POSTGRES_DB:-noahub}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noahub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: noa-hub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sftp:
    image: atmoz/sftp:alpine
    container_name: noa-hub-sftp
    ports:
      - "2222:22"
    # username:password:::dir-to-create-under-home
    command: noahub:noahub_pw:::upload
    volumes:
      - ./fixtures/sftp/upload:/home/noahub/upload

  backend:
    build: ./backend
    container_name: noa-hub-backend
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sftp:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: noa-hub-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/node_modules/.vite      # keep Vite dep cache inside container
    environment:
      CHOKIDAR_USEPOLLING: "true"    # reliable HMR on Windows bind mounts
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data: