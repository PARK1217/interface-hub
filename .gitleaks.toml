# gitleaks 설정 — 기본 룰 + 테스트용 가짜 값 허용
# 커밋 해시 기반 .gitleaksignore 대신 값 패턴으로 허용 (기록 재작성 후에도 유지됨)
[extend]
useDefault = true

[allowlist]
description = "테스트·CI 전용 가짜 값 (실제 키 아님)"
regexes = [
    # _check_ai_*.py — 일부러 실패하도록 만든 가짜 Mistral 키
    '''sk-deliberately-invalid''',
    # ci.yml SECRET_KEY — base64("dev-only…replace in production") 자리표시 값
    '''^ZGV2LW9ubHk''',
]
